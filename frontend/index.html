<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navi — 我的导航页</title>
  <meta name="description" content="个人导航首页，支持多搜索引擎、分类书签、Cloudflare D1 云备份" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="dark">

  <!-- 背景层 -->
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-overlay"></div>

  <!-- ── 主应用（登录后可见）── -->
  <div id="appRoot">

    <!-- 顶部工具栏 -->
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="logo">🧭 Navi</span>
      </div>
      <div class="top-bar-right">
        <!-- Cloudflare D1 设置 -->
        <a href="/settings" class="icon-btn" id="btnCloudSettings" title="Cloudflare D1 设置" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 15a4 4 0 0 0 4 4h9a5 5 0 0 0 1.08-9.879 5.001 5.001 0 0 0-9.78 1.5A3.5 3.5 0 0 0 3 15z"/>
          </svg>
        </a>
        <!-- 主题切换 -->
        <button class="icon-btn" id="btnTheme" title="切换主题">
          <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <svg id="iconMoon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
      <div class="top-bar-right">
        <button class="icon-btn" id="btnSettings" title="系统设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
        <!-- 退出登录 -->
        <button class="icon-btn" id="btnLogout" title="退出登录">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 搜索区域 -->
      <section class="search-section">
        <h1 class="greeting" id="greeting">你好！</h1>
        <div class="search-box">
          <input type="text" class="search-input" id="searchInput" placeholder="搜索或输入网址..." autocomplete="off"
            spellcheck="false" />
          <button class="search-btn" id="searchBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
        </div>
      </section>

      <!-- 书签区域 -->
      <section class="bookmarks-section" id="bookmarksSection">
        <!-- 动态渲染 -->
      </section>

      <!-- 添加分组按钮 -->
      <div class="add-group-row">
        <button class="add-group-btn" id="btnAddGroup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          新增分组
        </button>
      </div>
    </main>

    <!-- Toast 通知 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ── 模态框：添加/编辑网站 ── -->
    <div class="modal-backdrop hidden" id="siteModalBackdrop">
      <div class="modal" id="siteModal">
        <div class="modal-header">
          <h2 id="siteModalTitle">添加网站</h2>
          <button class="modal-close" id="siteModalClose">✕</button>
        </div>
        <form id="siteForm">
          <input type="hidden" id="siteId" />
          <div class="form-group">
            <label>网站名称</label>
            <input type="text" id="siteTitle" placeholder="例：GitHub" required />
          </div>
          <div class="form-group">
            <label>网站地址</label>
            <input type="url" id="siteUrl" placeholder="https://..." required />
          </div>
          <div class="form-group">
            <label>图标（选填，留空自动获取 favicon）</label>
            <input type="text" id="siteIcon" placeholder="emoji 或图标 URL" />
          </div>
          <div class="form-group">
            <label>所属分组</label>
            <select id="siteGroupId"></select>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary" id="siteModalCancel">取消</button>
            <button type="submit" class="btn-primary">保存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ── 模态框：添加/编辑分组 ── -->
    <div class="modal-backdrop hidden" id="groupModalBackdrop">
      <div class="modal" id="groupModal">
        <div class="modal-header">
          <h2 id="groupModalTitle">新建分组</h2>
          <button class="modal-close" id="groupModalClose">✕</button>
        </div>
        <form id="groupForm">
          <input type="hidden" id="groupId" />
          <div class="form-group">
            <label>分组名称</label>
            <input type="text" id="groupName" placeholder="例：工具网站" required />
          </div>
          <div class="form-group">
            <label>图标（emoji）</label>
            <input type="text" id="groupIcon" placeholder="📁" maxlength="4" />
            <div class="emoji-picker" id="emojiPicker">
              <!-- 这里将由 JS 动态渲染预设 emoji -->
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary" id="groupModalCancel">取消</button>
            <button type="submit" class="btn-primary">保存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ── 模态框：外观设置 ── -->
    <div class="modal-backdrop hidden" id="settingsModalBackdrop">
      <div class="modal" id="settingsModal">
        <div class="modal-header">
          <h2>⚙️ 系统设置</h2>
          <button class="modal-close" id="settingsModalClose">✕</button>
        </div>
        <div class="settings-content">
          <div class="settings-section">
            <h3>偏好设置</h3>
            <div class="form-group">
              <label>背景样式</label>
              <select id="settingBackground">
                <option value="gradient">渐变色</option>
                <option value="dark-solid">纯深色</option>
                <option value="light-solid">纯浅色</option>
              </select>
            </div>
            <div class="form-group">
              <label>搜索引擎</label>
              <select id="settingSearchEngine">
                <option value="google">Google</option>
                <option value="bing">Bing</option>
                <option value="baidu">百度</option>
              </select>
            </div>
          </div>
          <div class="settings-section">
            <h3>系统维护</h3>
            <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <span style="font-size: .88rem; color: var(--text-primary);">版本更新</span>
                <p style="font-size: .78rem; color: var(--text-muted); margin-top: 4px;">检查最新代码并一键升级</p>
              </div>
              <button class="btn-primary" id="btnUpgrade" style="padding: 6px 12px; font-size: .88rem;">检查并升级</button>
            </div>
            <div id="upgradeLog" class="settings-logs hidden" style="margin-top: 10px;"></div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /#appRoot -->

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
