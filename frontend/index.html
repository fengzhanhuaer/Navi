<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navi — 我的导航页</title>
  <meta name="description" content="个人导航首页，支持多搜索引擎、分类书签、Cloudflare D1 云备份" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="dark">

  <!-- 背景层 -->
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-overlay"></div>

  <!-- 顶部工具栏 -->
  <header class="top-bar">
    <div class="top-bar-left">
      <span class="logo">🧭 Navi</span>
    </div>
    <div class="top-bar-right">
      <button class="icon-btn" id="btnSync" title="同步到 D1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6M1 20v-6h6" />
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
        </svg>
      </button>
      <button class="icon-btn" id="btnTheme" title="切换主题">
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <svg id="iconMoon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">
    <!-- 搜索区域 -->
    <section class="search-section">
      <h1 class="greeting" id="greeting">你好！</h1>
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索或输入网址..." autocomplete="off"
          spellcheck="false" />
        <button class="search-btn" id="searchBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
      </div>
    </section>

    <!-- 书签区域 -->
    <section class="bookmarks-section" id="bookmarksSection">
      <!-- 动态渲染 -->
    </section>

    <!-- 添加分组按钮 -->
    <div class="add-group-row">
      <button class="add-group-btn" id="btnAddGroup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        新增分组
      </button>
    </div>
  </main>

  <!-- Toast 通知 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 同步状态指示器 -->
  <div class="sync-status" id="syncStatus"></div>

  <!-- ── 模态框：添加/编辑网站 ── -->
  <div class="modal-backdrop hidden" id="siteModalBackdrop">
    <div class="modal" id="siteModal">
      <div class="modal-header">
        <h2 id="siteModalTitle">添加网站</h2>
        <button class="modal-close" id="siteModalClose">✕</button>
      </div>
      <form id="siteForm">
        <input type="hidden" id="siteId" />
        <div class="form-group">
          <label>网站名称</label>
          <input type="text" id="siteTitle" placeholder="例：GitHub" required />
        </div>
        <div class="form-group">
          <label>网站地址</label>
          <input type="url" id="siteUrl" placeholder="https://..." required />
        </div>
        <div class="form-group">
          <label>图标（选填，留空自动获取 favicon）</label>
          <input type="text" id="siteIcon" placeholder="emoji 或图标 URL" />
        </div>
        <div class="form-group">
          <label>所属分组</label>
          <select id="siteGroupId"></select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="siteModalCancel">取消</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── 模态框：添加/编辑分组 ── -->
  <div class="modal-backdrop hidden" id="groupModalBackdrop">
    <div class="modal" id="groupModal">
      <div class="modal-header">
        <h2 id="groupModalTitle">新建分组</h2>
        <button class="modal-close" id="groupModalClose">✕</button>
      </div>
      <form id="groupForm">
        <input type="hidden" id="groupId" />
        <div class="form-group">
          <label>分组名称</label>
          <input type="text" id="groupName" placeholder="例：工具网站" required />
        </div>
        <div class="form-group">
          <label>图标（emoji）</label>
          <input type="text" id="groupIcon" placeholder="📁" maxlength="4" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="groupModalCancel">取消</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── 模态框：设置面板 ── -->
  <div class="modal-backdrop hidden" id="settingsModalBackdrop">
    <div class="modal modal-lg" id="settingsModal">
      <div class="modal-header">
        <h2>⚙️ 设置</h2>
        <button class="modal-close" id="settingsModalClose">✕</button>
      </div>
      <div class="settings-content">
        <div class="settings-section">
          <h3>外观</h3>
          <div class="form-group">
            <label>背景样式</label>
            <select id="settingBackground">
              <option value="gradient">渐变色</option>
              <option value="dark-solid">纯深色</option>
              <option value="light-solid">纯浅色</option>
            </select>
          </div>
        </div>
        <div class="settings-section">
          <h3>☁️ Cloudflare D1 同步</h3>
          <div class="d1-status-row">
            <span>连接状态：</span>
            <span id="d1StatusText" class="status-badge">检测中...</span>
          </div>
          <div class="d1-actions">
            <button class="btn-primary" id="btnManualSync">立即同步到 D1</button>
            <button class="btn-danger" id="btnRestoreD1">从 D1 恢复数据</button>
          </div>
          <div class="sync-logs" id="syncLogs"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
