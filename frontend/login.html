<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 — Navi</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dark">
  <div class="bg-layer"></div>
  <div class="bg-overlay"></div>

  <a href="https://github.com/fengzhanhua/Navi" target="_blank" rel="noopener noreferrer" class="github-promo" title="查看 GitHub 本项目">
    <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"></path>
    </svg>
    <span>GitHub</span>
  </a>

  <div id="authScreen">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-logo">🧭</span>
        <div class="auth-title">欢迎回来</div>
        <div class="auth-subtitle">请输入密码登录</div>
      </div>
      <div class="auth-body">
        <div class="auth-field">
          <label for="authUsername">用户名</label>
          <input type="text" id="authUsername" placeholder="输入用户名" autocomplete="username" />
        </div>
        <div class="auth-field">
          <label for="authPassword">密码</label>
          <input type="password" id="authPassword" placeholder="输入密码" autocomplete="current-password" />
        </div>
        <div class="auth-error" id="authError"></div>
        <button class="auth-btn" id="authBtn">登 录</button>
        <p class="auth-switch">
          没有账号？<a href="/register">点击注册</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // 已登录则直接跳回主页
    if (localStorage.getItem('navi_token')) {
      location.replace('/');
    }

    const btn = document.getElementById('authBtn');
    const err = document.getElementById('authError');

    async function doLogin() {
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value;
      err.textContent = '';
      if (!username || !password) { err.textContent = '用户名和密码不能为空'; return; }
      btn.disabled = true; btn.textContent = '登录中...';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        localStorage.setItem('navi_token', data.token);
        location.replace('/');
      } catch (e) {
        err.textContent = e.message;
      } finally {
        btn.disabled = false; btn.textContent = '登 录';
      }
    }

    btn.addEventListener('click', doLogin);
    document.getElementById('authPassword').addEventListener('keydown', e => e.key === 'Enter' && doLogin());
    document.getElementById('authUsername').addEventListener('keydown', e => e.key === 'Enter' && document.getElementById('authPassword').focus());
    setTimeout(() => document.getElementById('authUsername').focus(), 100);
  </script>
</body>
</html>
